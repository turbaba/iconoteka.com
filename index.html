<style>
:root {
  --bg: #ffffff;
  --surface: #f7f7f7;
  --surface2: #efefef;
  --border: #ededed;
  --text: #141414;
  --text-muted: #63626d;
  --text-dim: #8b8a94;
  --brand: #ffc3dc;
  --radius: 6px;
  --panel-w: 270px;
  --pad: 24px;
  --panel-pad: 20px;   /* side inset inside the two panels; header and grid keep --pad */
  --sb: 11px;   /* native scrollbar width inside the category list */
  /* radius scale */
  --r-xs: 3px;      /* scrollbar thumbs, slider track */
  --r-sm: 6px;      /* small controls: buttons, segmented, options */
  --r-md: 10px;     /* surfaces: cards, dropdown menus */
  --r-pill: 999px;  /* badges, tags, search */
  /* motion */
  --t-fast: .12s;   /* hover/colour */
  --t-base: .2s;    /* size/position */
  --t-slow: .28s;   /* panel + large moves */
  /* elevation */
  --shadow-md: 0 4px 16px rgba(20,20,20,0.12);
  --shadow-lg: 0 8px 30px rgba(20,20,20,0.18);
  --panel-margin: 0px;
  --ui-surface: #f2f2f3;
  --ui-surface-hover: #e8e8e8;
  --ui-input: #f3f3f4;
  --ui-input-hover: #eeeeef;
  --ui-seg-on: #ffffff;
  --ui-panel: #ffffff;
  --ui-dropdown: #ffffff;
  --ui-card-hover: rgba(242,242,243,0.7);
  --ui-card-active: #f2f2f3;
  --ui-slider-track: #efefef;
  --ui-slider-stop: #cecece;
  --logomark-color: #141414;
}
[data-theme="dark"] {
  --shadow-md: 0 4px 16px rgba(20,20,20,0.45);
  --shadow-lg: 0 8px 30px rgba(20,20,20,0.55);
  --bg: #191919;
  --surface: #222222;
  --surface2: #2a2a2a;
  --border: #333333;
  --text: #ffffff;
  --text-muted: #a2a2a2;
  --text-dim: #8a8a8a;
  --brand: #ffc3dc;
  --ui-surface: #2a2a2a;
  --ui-surface-hover: #363636;
  --ui-input: #252525;
  --ui-input-hover: #2e2e2e;
  --ui-seg-on: #3a3a3a;
  --ui-panel: #202020;
  --ui-dropdown: #242424;
  --ui-card-hover: rgba(50,50,50,0.49);
  --ui-card-active: #232323;
  --ui-slider-track: #2e2e2e;
  --ui-slider-stop: #444444;
  --logomark-color: #ffffff;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Inter', sans-serif; font-size: 14px; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; overflow: hidden; }
body { display: flex; flex-direction: column; }

/* HEADER */
header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 var(--panel-pad); height: 78px; flex-shrink: 0; column-gap: 8px; border-bottom: 1px solid var(--border); }
.logo-wrap { display: flex; align-items: center; gap: 8px; }
.logo { font-weight: 550; font-size: 23px; letter-spacing: -0.3px; color: var(--text); }
.logo-wrap a { transition: opacity var(--t-fast); color: var(--text); text-decoration: none; }
.action-btn.primary:hover { background: #333; opacity: 0.8; }
.action-btn.secondary:hover { background: var(--ui-surface-hover); opacity: 0.8; }
.beta-badge { font-size: 8.5px; font-weight: 700; background: var(--brand); color: #141414; height: 14px; padding: 2px 6px 0 6.6px; line-height: 1; border-radius: var(--r-pill); letter-spacing: 0.6px; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; position: relative; top: -2px; }
.header-search { display: flex; justify-content: center; align-items: center; width: 100%; min-width: 0; }
.header-nav { display: flex; align-items: center; gap: 32px; justify-content: flex-end; position: relative; top: -1px; }
.header-link { font-size: 14px; color: var(--text); text-decoration: none; transition: color var(--t-fast); font-weight: 600; }
.header-link:hover { color: var(--text); opacity: 0.8; }
/* hit area ≈ 38×(text+24)px without moving the text: padding cancelled by negative margins */
.header-link { padding: 10px 12px; margin: -10px -12px; border-radius: var(--r-sm); }

.header-btn { font-size: 16px; font-family: 'Inter', sans-serif; font-weight: 500; color: var(--text); background: var(--surface2); border: none; border-radius: var(--r-sm); padding: 6px 14px; cursor: pointer; text-decoration: none; transition: background var(--t-fast); }
.header-btn:hover { background: var(--ui-surface-hover); }

/* LAYOUT */
.layout { display: flex; flex: 1; min-height: 0; }

/* SIDEBAR */
aside { width: var(--panel-w); flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; padding-top: 20px; border-right: 1px solid var(--border); }
.sidebar-top { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.sidebar-controls { padding: 0px var(--panel-pad) 16px; display: flex; flex-direction: column; gap: 18px; flex-shrink: 0; }
.cat-list-wrap { overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--border) transparent; padding-bottom: 10px; }
.cat-list-wrap.has-scrollbar { width: 100%; }
.cat-list-wrap.has-scrollbar .cat-item { padding-right: calc(var(--panel-pad) - var(--sb)); }
.cat-list-wrap::-webkit-scrollbar { width: 3px; transition: width var(--t-base); }
.cat-list-wrap:hover::-webkit-scrollbar { width: 6px; }
.cat-list-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--r-xs); }
.cat-list-wrap:hover::-webkit-scrollbar-thumb { background: var(--text-dim); }
.cat-list-wrap::-webkit-scrollbar-track { background: transparent; }
.seg { display: flex; background: var(--ui-surface); border: none; border-radius: var(--r-sm); padding: 2px; gap: 2px; transition: background var(--t-fast); }
.seg:hover { background: var(--ui-surface-hover); }
.seg-btn { flex: 1; height: 28px; border: none; border-radius: var(--r-sm); cursor: pointer; font-size: 13px; font-family: 'Inter', sans-serif; color: var(--text-muted); background: transparent; transition: all var(--t-fast); }
.seg-btn:hover { color: var(--text); }
.seg-btn.on { background: var(--ui-seg-on); color: var(--text); font-weight: 500; box-shadow: var(--shadow-md); }
.style-row { display: flex; justify-content: flex-start; align-items: baseline; gap: 7px; }
.style-opts { display: flex; gap: 3px; }
.style-row .seg-btn { flex: none; height: auto; padding: 7px 8px; margin: -7px 0; background: none; box-shadow: none; border-radius: 0; font-size: 12px; font-weight: 500; color: var(--text-muted); }
.style-row .seg-btn:hover { color: var(--text); }
.style-row .seg-btn.on { background: none; box-shadow: none; color: var(--text); font-weight: 500; }
.slider-row { display: flex; flex-direction: column; gap: 14px; margin: 0; }
.slider-label-row { display: flex; justify-content: flex-start; align-items: baseline; gap: 15px; }
.slider-label { font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
.slider-val { font-size: 12px; color: var(--text); font-weight: 500; }
.slider-track-wrap { position: relative; height: 14px; display: flex; align-items: center; }
.weight-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: var(--r-xs); outline: none; cursor: pointer; position: relative; z-index: 1; background: transparent; }
.weight-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--text); cursor: pointer; transition: transform var(--t-fast); position: relative; z-index: 2; }
.weight-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
.weight-slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--text); cursor: pointer; border: none; }
.slider-stops-line { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); height: 4px; background: var(--ui-slider-track); border-radius: var(--r-xs); display: flex; align-items: center; justify-content: space-between; padding: 0; pointer-events: none; }
.slider-stop { width: 4px; height: 4px; background: var(--ui-slider-stop); border-radius: 50%; flex-shrink: 0; transition: background var(--t-fast); }
.slider-stop.hot { background: var(--text-muted); }
.cat-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 6px; cursor: pointer; user-select: none; }
.cat-header:hover .cat-label-text { color: var(--text); }
.cat-label-text { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 500; transition: color var(--t-fast); }
.cat-chevron { color: var(--text-muted); display: flex; transition: transform var(--t-base); }
.cat-header.collapsed .cat-chevron { transform: rotate(-90deg); }
.cat-list { overflow: hidden; transition: max-height var(--t-slow) cubic-bezier(.4,0,.2,1); }
.cat-list.collapsed { max-height: 0 !important; }
.cat-item { display: flex; align-items: center; justify-content: space-between; padding: 5px var(--panel-pad) 6px; cursor: pointer; color: var(--text-muted); font-size: 12px; transition: color var(--t-fast); }
.cat-item:hover { background: transparent; color: var(--text); opacity: 0.8; }
.cat-item.active { background: transparent; color: var(--text); font-weight: 600; }
.cat-count { font-size: 12px; opacity: 0.45; padding-right: 3px; position: relative; right: -4px; }
.sidebar-ver { padding: 20px var(--panel-pad); margin-top: auto; flex-shrink: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.footer-ver { font-size: 11px; line-height: 1.5; white-space: nowrap; color: var(--text-muted); }
/* version number: one style across the site — 12px medium system mono (same as the About page) */
.ver-num { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; }
.footer-link { color: inherit; text-decoration: none; transition: color var(--t-fast); }
.footer-link:hover { color: var(--text); }
.sidebar-footer { display: none; }

/* MAIN */
.main-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow-y: scroll; scrollbar-width: thin; scrollbar-color: var(--border) transparent; scrollbar-gutter: stable both-edges; }
.search-wrap { position: relative; width: clamp(300px, calc(300px + (100vw - 861px) * 0.114), 410px); max-width: 100%; min-width: 120px; flex-shrink: 1; }
.search-ico { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); pointer-events: none; display: flex; color: var(--text-muted); }
.search-input { width: 100%; height: 44px; padding: 0 50px 1px 22px; background: var(--ui-input); border: 1px solid transparent; border-radius: var(--r-pill); font-size: 16px; font-family: 'Inter', sans-serif; color: var(--text); outline: none; transition: background var(--t-fast); }
.search-input:hover { background: var(--ui-input-hover); }
.search-input:focus { border-color: transparent; }
.search-input::placeholder { color: var(--text-muted); opacity: 1; }
.search-input:focus { border-color: transparent; }
.search-input::placeholder { color: var(--text-muted); opacity: 1; }
.search-count { position: absolute; right: 79px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--text-muted); opacity: 0.65; pointer-events: none; white-space: nowrap; display: none; }
.search-count.visible { display: block; }
.search-clear { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); display: none; align-items: center; justify-content: center; padding: 0; line-height: 0; }
.search-clear.visible { display: flex; }
.search-wrap:has(.search-clear.visible) .search-ico { display: none; }
.search-wrap:has(.search-clear.visible) .search-count { right: 44px; }

/* GRID */
main { flex: 1; padding: 28px calc(var(--pad) + 10px) 40px calc(var(--pad) + 10px); display: flex; flex-direction: column; align-items: center; }
main::-webkit-scrollbar { width: 4px; }
main::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--r-xs); }
.category-section { margin-bottom: 32px; width: 100%; max-width: 1256px; padding-top: 28px; margin-left: auto; margin-right: auto; }
.category-section:first-child { padding-top: 0; }
.category-title { font-size: 14px; font-weight: 500; color: var(--text); padding: 0 0 20px 0; display: flex; align-items: baseline; gap: 8px; }
.category-title span { opacity: 0.6; font-size: 14px; font-weight: 400; color: var(--text-muted); }
.icons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px 24px; width: 100%; max-width: 1256px; }

/* ICON CARD */
.icon-card { width: 100%; height: 128px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 16px; gap: 8px; border-radius: var(--r-md); cursor: pointer; background: transparent; border: 1px solid transparent; transition: background var(--t-fast), border-color .1s; color: var(--text); position: relative; flex-shrink: 0; overflow: hidden; }
.icon-card:hover { background: var(--ui-card-hover); border-color: transparent; }
.icon-card.focused { background: var(--ui-card-hover); border-color: transparent; outline: none; }
.icon-card.active-panel { background: var(--ui-surface); border-color: transparent; }
.icon-svg-wrap { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex-shrink: 0; }
.icon-label { font-size: 14px; color: var(--text-muted); text-align: center; line-height: 1.2; width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; padding: 0 6px; }
.icon-card:hover .card-dl-btn { opacity: 1; }

/* LOADING */
#loading { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text-muted); }
.spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--text-muted); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { padding: 48px 16px; text-align: center; color: var(--text-muted); line-height: 1.43; font-size: 23px; width: 100%; max-width: 1256px; }
.empty a { color: var(--text); text-decoration: none; font-weight: 700; font-size: 16px; display: inline-block; margin-top: 20px; }

/* BETA badge shown again (user 2026-09-06) */

/* TOAST */
#toast { position: fixed; bottom: 20px; top: auto; left: 50%; transform: translateX(-50%); background: var(--brand); color: #141414; font-size: 12px; font-weight: 400; font-family: 'Inter', sans-serif; padding: 4px 14px; border-radius: var(--r-pill); pointer-events: none; opacity: 0; transition: opacity var(--t-slow); z-index: 2000; white-space: nowrap; width: auto; max-width: 400px; }
#toast.visible { opacity: 1; transition: opacity var(--t-base); }

@media (max-width: 480px) {
  #toast { font-size: 13px; padding: 8px 18px;
           top: calc(var(--toolbar-bottom, 160px) + 12px); bottom: auto; }
  #toast.visible { opacity: 1; }
}

/* TOOLTIP */
#tooltip { position: fixed; background: var(--text); color: #fff; font-size: 12px; font-family: 'Inter', sans-serif; padding: 4px 9px; border-radius: var(--r-sm); pointer-events: none; opacity: 0; transition: opacity var(--t-fast); z-index: 1000; white-space: nowrap; }
#tooltip.visible { opacity: 1; }
#themeToggle { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); padding: 0; transition: color var(--t-fast); flex-shrink: 0; }
#themeToggle:hover { color: var(--text); }

/* PANEL */
#panel { position: fixed; top: 78px; right: 0; height: calc(100vh - 78px); width: var(--panel-w); background: var(--bg); border: none; border-radius: 0; display: flex; flex-direction: column; z-index: 500; transition: right var(--t-slow) cubic-bezier(.4,0,.2,1); box-shadow: none; overflow: hidden; }
[data-theme="dark"] .logo { color: #ffffff; }
[data-theme="dark"] #logomark { color: #ffffff; }
[data-theme="dark"] .logo-wrap a { color: #ffffff; }
#logomark { color: var(--text); }
#panel.open { right: 0; }
/* Mobile toolbar: search + controls as a single bar beneath the header */
@media (max-width: 480px) {
  .beta-badge { top: -3px; } /* whole chip 1px higher on mobile (base top is -2px) */
  .toolbar { display: flex; flex-direction: column; gap: 10px; padding: 10px;
             border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .toolbar .mobile-search-row { padding: 0; }
  .toolbar .mobile-controls { padding: 0; }
  /* category title sits at double the grid's left inset */
  .category-title { padding-left: 10px; }
  /* logo is decorative here — no tap, no hover feedback */
  .logo-wrap a { pointer-events: none; }
  .logo-wrap a:hover { opacity: 1; }
}
/* above mobile the wrapper must not create a box of its own */
@media (min-width: 481px) { .toolbar { display: contents; } }

/* Burger menu footer on mobile + tablet: credit left, theme toggle right */
@media (max-width: 860px) {
  .burger-ver { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .burger-ver #themeToggle { position: relative; bottom: 2px; flex-shrink: 0; }
}

/* Mobile only: the always-open panel is a desktop pattern, so below 481px it
   becomes a dismissible full-width sheet and the grid gets its width back.
   (Tablet has its own single-column layout and must not match this.) */
@media (max-width: 480px) {
  .main-wrap { padding-right: 0 !important; }
  /* Bottom sheet: no preview — name, tags and actions across the full width */
  #panel { left: 0; right: 0 !important; bottom: 0; top: auto;
           width: 100% !important; height: auto; max-height: 62vh;
           flex-direction: column;
           border-left: none; border-top: 1px solid var(--border);
           transform: translateY(105%);
           transition: transform var(--t-slow) cubic-bezier(.4,0,.2,1); }
  #panel.sheet-open { transform: translateY(0); }
  #panel .panel-preview { display: none; }
  #panel .panel-body { flex: 1 1 auto; min-width: 0; overflow-y: auto;
                       border-left: none; padding: 18px var(--panel-pad) 18px; gap: 14px; }
  #panel .panel-body-top { margin-top: 0; flex: 0 0 auto; gap: 10px; }
  #panel .panel-body-bottom { padding-bottom: 0; }
  #panel .panel-name { font-size: 22px; letter-spacing: -0.65px; }
  #panel .action-btn { height: 38px; font-size: 13px; white-space: nowrap; }
  #panel .tags-wrap { height: 23px; margin-top: -1px; }
  #panel .copy-row { flex-wrap: nowrap; white-space: nowrap; gap: 10px; }
  #panel .actions-list > *:nth-child(2) { display: flex; gap: 8px; }
  #panel .actions-list > *:nth-child(2) .action-btn { flex: 1; min-width: 0; }
  /* two rows: all three buttons on one, export + copy-code on the next.
     Children 2 and 3 have no classes, so they're addressed by position. */
  #panel .actions-list { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);
                         gap: 15px 8px; align-items: center; }
  #panel .actions-list > *:nth-child(1) { grid-column: 1; grid-row: 1; }        /* Copy SVG      */
  #panel .actions-list > *:nth-child(2) { grid-column: 2 / span 2; grid-row: 1; /* Save SVG/PNG  */
                                          display: flex; gap: 8px; }
  #panel .actions-list > *:nth-child(2) .action-btn { flex: 1; min-width: 0; }
  #panel .actions-list > *:nth-child(3) { grid-column: 1; grid-row: 2; margin: 0 !important; min-width: 0; } /* Export size */
  /* its label row carries inline gap/layout from JS — tighten so it fits its column */
  #panel .actions-list > *:nth-child(3) > div { gap: 8px !important; min-width: 0; }
  #panel .actions-list > *:nth-child(3) .size-combobox { width: 40px; }
  #panel .actions-list > .copy-row      { grid-column: 2 / span 2; grid-row: 2; margin: 0;
                                          justify-content: flex-end; } /* Copy code, flush right */
  .panel-sheet-close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--r-pill); color: var(--text); font-size: 15px; line-height: 1; cursor: pointer; }
}
@media (min-width: 861px) { .panel-sheet-close { display: none; } }
.logo-wrap { position: relative; top: -1px; } /* whole logo group 1px up, every breakpoint */

.main-wrap { padding-right: var(--panel-w); transition: padding-right var(--t-slow) cubic-bezier(.4,0,.2,1); }
.panel-preview { width: 100%; background: transparent; border-left: 1px solid var(--border); padding: 20px var(--panel-pad) 0 calc(var(--panel-pad) - 1px); display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; cursor: pointer; border-radius: 0; overflow: visible; z-index: 1; user-select: none; -webkit-user-select: none; }
.empty a:hover { opacity: 0.8; }
/* badge: one of three brand shapes (radius 200 / 420 / 960 on a 1024 tile), picked at random per preview */
.preview-badge { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; transition: none; }
.preview-badge svg { width: 60%; height: 60%; }
.panel-body { flex: 1; overflow-y: auto; border-left: 1px solid var(--border); padding: 20px var(--panel-pad) 0 calc(var(--panel-pad) - 1px); display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; user-select: none; -webkit-user-select: none; min-height: 0; }

.tag:hover { background: var(--ui-surface-hover); color: var(--text); }
.tag-pill { border-radius: var(--r-pill); padding-left: 9px; padding-right: 9px; }

.panel-section-label { font-size: 12px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.actions-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.action-btn { display: flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px 2px; border-radius: var(--r-sm); cursor: pointer; font-size: 13px; font-family: 'Inter', sans-serif; transition: all var(--t-fast); width: 100%; font-weight: 600; border: none; }
.action-btn.primary { background: var(--text); color: #fff; }
.action-btn.primary:hover { background: #333; }
.action-btn.secondary { background: var(--ui-surface); color: var(--text); }
.action-btn.secondary:hover { background: var(--ui-surface-hover); }
[data-theme="dark"] .action-btn.primary { background: var(--text); color: var(--bg); }
[data-theme="dark"] .action-btn.primary:hover { background: var(--text); opacity: 0.85; }
.action-btn.success { opacity: 0.6; }
.copy-row { display: flex; align-items: baseline; gap: 15px; margin-top: 3px; flex-wrap: nowrap; white-space: nowrap; }
.copy-opts { display: flex; gap: 12px; }
.copy-label { font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
.copy-btn { background: none; border: none; cursor: pointer; font-size: 12px; font-weight: 500; font-family: 'Inter', sans-serif; color: var(--text-muted); padding: 3px 0; border-radius: var(--r-sm); transition: color var(--t-fast); }
.copy-btn:hover { background: none; color: var(--text); opacity: 1; }

.size-pill { height: 28px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-pill); background: transparent; font-size: 12px; font-family: 'Inter', sans-serif; color: var(--text-muted); cursor: pointer; transition: all var(--t-fast); }
.size-pill:hover { border-color: var(--text-dim); color: var(--text); }
.size-pill.active { background: var(--text); color: #fff; border-color: var(--text); }
.size-combobox-wrap { position: relative; display: inline-flex; align-items: center; background: none;  transition: background var(--t-fast); }
.size-combobox-wrap:hover .size-combobox, .size-combobox-wrap:focus-within .size-combobox { color: var(--text); }

.size-combobox { width: 36px; text-align: left; border: none; background: none; font-size: 12px; font-family: 'Inter', sans-serif; font-weight: 500; color: var(--text); outline: none; cursor: text; padding: 0; line-height: 1; }
.size-combobox-arrow { display: flex; align-items: center; padding: 0 0 0 1px; color: var(--text-muted); cursor: pointer; }

.size-dropdown-menu.open { display: flex; }
.size-dropdown-opt { background: none; border: none; cursor: pointer; font-size: 12px; font-family: 'Inter', sans-serif; font-weight: 500; color: var(--text); padding: 6px 10px; border-radius: var(--r-sm); text-align: left; transition: background var(--t-fast); }
.size-dropdown-opt:hover { background: var(--ui-surface); }
.size-dropdown-opt.active { font-weight: 700; }
.tablet-controls { display: none; }
.burger-btn { display: none; background: none; border: none; cursor: pointer; padding: 4px; margin-right: -4px; color: var(--text); }
/* hover for the few controls that had none, and a pressed state for every control (2026-09-06) */
.burger-btn, .search-clear, .panel-sheet-close, .mob-size-btn { transition: opacity var(--t-fast); }
.burger-btn:hover, .search-clear:hover, .panel-sheet-close:hover, .mob-size-btn:hover { opacity: .8; }
.header-link:active, .logo-wrap a:active, .header-btn:active, .action-btn:active, .seg-btn:active, .cat-item:active, .cat-header:active, .footer-link:active,

.search-clear:active, .panel-sheet-close:active, .empty a:active { opacity: .6; }

@media (min-width: 481px) and (max-width: 860px) {
  header { grid-template-columns: auto 1fr auto; height: 78px; padding: 0 var(--panel-pad); position: relative; column-gap: 20px; }
  .header-search { display: flex; grid-column: 2; }
  .header-nav { display: none; }
  .burger-btn { display: flex; align-items: center; justify-content: center; grid-column: 3; grid-row: 1; }
  .burger-menu { right: auto; left: 20px; }
  /* Single left column: controls + category dropdown + icon panel, stacked */
  .tablet-controls { display: none !important; }
  .cat-list-wrap { display: none; }
  .main-wrap { padding-right: 0 !important; }
  #panel { position: static; width: 100%; height: auto; flex: 1; min-height: 0;
           border-left: none; background: transparent; }
  #panel .panel-body { border-left: none; }
  /* content is one block, pinned to the bottom; margin-top:auto (not justify-content)
     so the panel still scrolls when it overflows */
  #panel .panel-body { justify-content: flex-start; overflow-y: auto; }
  #panel .panel-body-top { margin-top: auto; flex: 0 0 auto; }
  #panel .panel-body-bottom { padding-bottom: 19px; }
  /* version + credit + theme live in the burger menu at this width */
  aside .sidebar-ver { display: none; }
  .burger-ver { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .burger-ver #themeToggle { position: relative; bottom: 2px; flex-shrink: 0; }
  /* tags to a single row — the column is short enough without two */
  #panel .tags-wrap { height: 23px; }
  /* slightly smaller action buttons to suit the narrower column */
  #panel .action-btn { height: 34px; font-size: 12px; padding: 0 14px 2px; }
  /* icon name 20% smaller in the narrower column */
  #panel .panel-name { font-size: 21.6px; letter-spacing: -0.64px; }
  /* no preview at this width — the space is better spent on the grid */
  #panel .panel-preview { display: none; }
  /* category picker matches the Export size control: label + plain value + chevron */
  aside .tab-cat-wrap { width: 100%; display: flex; align-items: baseline; gap: 15px; }
  aside .tab-cat-wrap::before { content: 'Category:'; font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
  aside .tab-cat-btn { width: auto; height: auto; padding: 0; gap: 1px; background: none; border: none;
    border-radius: 0; font-size: 12px; font-weight: 500; color: var(--text);
    transition: color var(--t-fast); }
  aside .tab-cat-btn:hover { background: none; color: var(--text); }
  aside .tab-cat-btn svg { width: 10px; height: 10px; }
  /* controls take their natural height; the panel takes the slack */
  aside .sidebar-top { flex: 1; min-height: 0; }
  aside .sidebar-controls { flex: 0 0 auto; }
  aside { overflow: hidden; }
  #panel .panel-body { overflow-y: auto; }
  /* not a sheet at this size — the close control belongs to mobile only */
  .panel-sheet-close { display: none; }
  .panel-preview { aspect-ratio: 4/3; }
  .panel-preview svg { max-width: 111px; max-height: 111px; }
  .logo-wrap { grid-column: 1; }


  aside { display: flex; }
  .layout { flex-direction: row; }
  main { padding: 28px 24px 40px; }
  .icons-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .icon-card { flex: 1 1 calc(16.66% - 10px); min-width: 90px; max-width: 130px; }

  /* Tablet controls bar — row 2: categories + style switch + weight slider */
  .tablet-controls { display: flex; align-items: center; padding: 6px var(--panel-pad) 20px; gap: 24px; }

  /* Seg */
  .tab-seg { display: flex; background: var(--ui-surface); border-radius: var(--r-sm); padding: 2px; gap: 2px; flex-shrink: 0; }
  .tab-seg .seg-btn { height: 34px; font-size: 13px; padding: 0; width: 64px; }

  .tab-cat-dropdown.open { display: flex; }
  .tab-cat-option { background: none; border: none; cursor: pointer; font-size: 14px; font-family: 'Inter', sans-serif; color: var(--text); padding: 10px 16px; border-radius: var(--r-sm); text-align: left; display: flex; justify-content: space-between; gap: 16px; }

  .tab-cat-option.active { font-weight: 700; }
  .tab-cat-count { font-size: 12px; opacity: 0.4; }
}
.burger-menu { display: none; position: fixed; background: var(--ui-panel); border-radius: var(--r-md); box-shadow: var(--shadow-md); padding: 8px; z-index: 1000; flex-direction: column; gap: 2px; width: 272px; }
.burger-menu.open { display: flex; }
.burger-link { font-size: 14px; font-weight: 600; color: var(--text); text-decoration: none; padding: 14px 12px; border-radius: var(--r-sm); }
.burger-link:hover { background: var(--surface); }
.burger-ver { font-size: 12px; color: var(--text-muted); padding: 12px 12px 8px; line-height: 1.6; }
.burger-ver #themeToggle { color: var(--text-muted); }
.mobile-controls { display: none; }
.mobile-search-row { display: none; }

@media (max-width: 480px) {
  header { grid-template-columns: 1fr auto; height: auto; padding: 18px var(--panel-pad) 16px; position: relative; column-gap: 0; }
  .header-search { display: none; }
  .header-nav { display: none; }
  .burger-btn { display: flex; align-items: center; justify-content: center; }
  .logo { font-size: 18.9px; }

  /* Mobile search row */
  .mobile-search-row { display: flex; padding: 0 10px 10px; }
  .mobile-search-row .search-wrap { width: 100%; max-width: 100%; }
  .mobile-search-row .search-input { height: 46px; padding-left: 20px; }

  /* Mobile controls row */
  .mobile-controls { display: flex; align-items: center; padding: 0; gap: 7px; }

  .mob-seg { display: flex; flex: 3 1 auto; min-width: 0; background: var(--ui-surface); border-radius: var(--r-sm); padding: 2px; gap: 2px; }

  .mob-weight { display: flex; align-items: center; flex: 1 1 auto; min-width: 0; background: var(--ui-surface); border-radius: var(--r-sm); height: 38px; padding: 0 5px 0 12px; justify-content: space-between; }

  .mob-weight-btn:hover { color: var(--text); }
  .mob-weight-btn:disabled { opacity: 0.25; cursor: default; }

  /* Custom size dropdown */
  .mob-size-wrap { position: relative; display: flex; align-items: center; flex: 0 0 auto; }
  .mob-size-btn { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--ui-surface); border: none; border-radius: var(--r-sm); font-size: 13px; font-family: 'Inter', sans-serif; font-weight: 500; color: var(--text); padding: 0 8px 0 12px; cursor: pointer; outline: none; height: 38px; width: 82px; }
  .mob-size-dropdown { display: none; position: fixed; background: var(--ui-panel); border-radius: var(--r-md); box-shadow: var(--shadow-md); padding: 8px; z-index: 1000; flex-direction: column; gap: 2px; min-width: 90px; }
  .mob-size-dropdown.open { display: flex; }
  .mob-size-option { background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 500; font-family: 'Inter', sans-serif; color: var(--text); padding: 8px 14px; border-radius: var(--r-sm); text-align: left; }
  .mob-size-option:hover { background: var(--surface); }
  .mob-size-option.active { color: var(--text); font-weight: 700; }

  aside { display: none; }
  .layout { flex-direction: column; }
  main { padding: 20px 10px 40px; }

  /* 4 icons per row evenly */
  .icons-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 8px; max-width: 100%; width: 100%; }
  .icon-card { width: 100%; height: 104px; padding-top: 8px; }

  .icon-svg-wrap { width: 40px; height: 40px; }

  .empty { font-size: 18px; }
}

const LOWERCASE_WORDS = new Set(['of','in','at','to','an','the','and','or','but','for','with','by','from','as','into','via','per']);

function formatSegment(seg) {
  if (CAPITALIZE_MAP[seg]) return CAPITALIZE_MAP[seg];
  if (HYPHENATE_MAP[seg]) {
    return HYPHENATE_MAP[seg].split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('-');
  }
  const parts = seg.split('_');
  const result = [];
  let i = 0;
  while (i < parts.length) {
    // Try to match longest combo starting at i
    let matched = false;
    for (let j = parts.length; j > i + 1; j--) {
      const combo = parts.slice(i, j).join('_');
      if (HYPHENATE_MAP[combo]) {
        const hyphenated = HYPHENATE_MAP[combo].split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('-');
        result.push(hyphenated);
        i = j;
        matched = true;
        break;
      }
    }
    if (!matched) {
      const w = parts[i];
      const isFirst = result.length === 0;
      if (!isFirst && LOWERCASE_WORDS.has(w)) {
        result.push(w);
      } else {
        result.push(CAPITALIZE_MAP[w] || (w.charAt(0).toUpperCase() + w.slice(1)));
      }
      i++;
    }
  }
  return result.join(' ');
}

function toTitleCase(str) {
  return str.split(' ').map(w => CAPITALIZE_MAP[w.toLowerCase()] || (w.charAt(0).toUpperCase() + w.slice(1))).join(' ');
}

function hexLuminance(hex) {
  const c = hex.replace('#','');
  const r = parseInt(c.slice(0,2),16)/255, g = parseInt(c.slice(2,4),16)/255, b = parseInt(c.slice(4,6),16)/255;
  const toL = x => x <= 0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4);
  return 0.2126*toL(r) + 0.7152*toL(g) + 0.0722*toL(b);
}

const DARK_EXCLUDED_BG = new Set(['#141414','#161635','#392518','#1e2d00']);   // too close to the dark panel
const badgeSet = (dark) => BADGE_COLORS.filter(c => {
  if (!dark) return true;
  if (DARK_EXCLUDED_BG.has(c.bg)) return false;
  const h = c.bg.slice(1); const lum = 0.299*parseInt(h.slice(0,2),16) + 0.587*parseInt(h.slice(2,4),16) + 0.114*parseInt(h.slice(4,6),16);

});

let lastBadgeBg = null;
function randomColorPair() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const set = badgeSet(isDark).filter(c => c.bg !== lastBadgeBg);
  const total = set.reduce((a, c) => a + c.w, 0);
  let r = Math.random() * total, pick = set[set.length - 1];
  for (const c of set) { r -= c.w; if (r <= 0) { pick = c; break; } }
  lastBadgeBg = pick.bg;
  return [pick.bg, pick.fg];
}

async function loadIcons() {
  try {
    const res = await fetch(CDN);
    const data = await res.json();
    iconsData = data.icons || [];
    iconsMap = {};
    iconsData.forEach(i => { iconsMap[i.name] = i; });
    meta = data.meta || {};
    const ver = meta.version ? 'v' + meta.version.split('.').map(x => String(+x)).join('.') : '';   // 02.00.05 → v2.0.5 (conventional, same as the About page)
    document.getElementById('footerVer').innerHTML = '<span class="ver-num">' + ver + '</span><br>Made by <a href="https://turbaba.com" target="_blank" class="footer-link">Oleg Turbaba</a>';
      const _bv = document.querySelector('.burger-ver');
      if (_bv) { const _t = _bv.querySelector('#themeToggle');
                 _bv.innerHTML = '<span><span class="ver-num">' + ver + '</span><br>Made by Oleg Turbaba</span>';
                 if (_t) _bv.appendChild(_t); }
    buildSidebar();
    buildTabCatDropdown();
    render();
    initLogomark();
    // Track session theme
    const sessionTheme = document.documentElement.getAttribute('data-theme') || 'light';
    sendAnalytics({ type: 'theme', theme: sessionTheme, action: 'session_start' });
    // Open icon from URL hash
    const hash = decodeURIComponent(window.location.hash.slice(1));
    if (hash) {
      const found = iconsData.find(i => i.name.split('-')[0] === hash);
      if (found) openPanel(found);
    }
    // No hash (or it matched nothing): open a random Popular icon so the panel is never empty
    if (!panelIcon) {
      const pop = iconsData.filter(i => i.popular);   // Popular is a flag on the real entry (02.00.08)
      if (pop.length) openPanel(pop[Math.floor(Math.random() * pop.length)]);
    }
  } catch(e) {
    document.getElementById('loading').innerHTML = '<div class="empty">Failed to load icons. <a href="#" onclick="loadIcons()">Retry</a></div>';
  }
}
function buildSidebar() {
  const map = {};
  iconsData.forEach(i => { const c = i.category || 'Other'; map[c] = (map[c] || 0) + 1; });
  const SIDEBAR_PINNED = ['Interface', 'Files & Data', 'Hardware', 'Map'];
  const pinnedEntries = SIDEBAR_PINNED.filter(k => map[k]).map(k => [k, map[k]]);
  const sorted = [...pinnedEntries, ...Object.entries(map).filter(([name]) => !SIDEBAR_PINNED.includes(name)).sort(([a],[b]) => a.localeCompare(b))];
  const total = iconsData.length;   // no duplicate Popular entries any more
  const catList = document.getElementById('catList');
  catList.innerHTML = '';
  const popularCount = iconsData.filter(i => i.popular).length;
  [['Popular', popularCount], ...sorted].forEach(([name, count]) => {
    const el = document.createElement('div');
    const catKey = name;
    el.className = 'cat-item' + (((state.activeCat || 'Popular') === catKey) ? ' active' : '');
    el.innerHTML = '<span>' + toTitleCase(name) + '</span><span class="cat-count">' + count + '</span>';
    el.addEventListener('click', () => {
      state.category = 'All'; state.activeCat = catKey; state.search = '';
      document.getElementById('search').value = '';
      document.getElementById('clearBtn').classList.remove('visible');
      buildSidebar(); render();
      scrollToCategory(catKey);
    });
    catList.appendChild(el);
  });
  catList.style.maxHeight = 'none';

  // Detect if scrollbar is visible and narrow aside
  const wrap = document.querySelector('.cat-list-wrap');
  const aside = document.querySelector('aside');
  const checkScroll = () => {
    wrap.classList.toggle('has-scrollbar', wrap.scrollHeight > wrap.clientHeight);
    aside.classList.remove('has-scrollbar');
  };
  checkScroll();
  new ResizeObserver(checkScroll).observe(wrap);
}

  wallet:       ['purse','payment','funds'],
  shopping:     ['cart','shopping_trolley'],
  cart:         ['shopping_trolley','basket'],
};

function fuzzyMatch(str, q) {
  let si = 0, qi = 0, score = 0, consecutive = 0;
  while (si < str.length && qi < q.length) {
    if (str[si] === q[qi]) {
      score += 1 + consecutive;
      consecutive++;
      qi++;
    } else {
      consecutive = 0;
    }
    si++;
  }
  return qi === q.length ? score : 0;
}

function wordMatch(segment, q) {
  return segment === q || segment.split('_').includes(q);
}

function scoreIcon(icon, q) {
  const name = icon.name.toLowerCase();
  const parts = name.split('-');
  const terms = (icon.searchTerms || []).map(t => t.toLowerCase());
  const cat = (icon.category || '').toLowerCase();

  // Exact full name or first segment
  if (name === q || parts[0] === q)                              return 1000;
  // Exact segment word match
  if (parts.some(p => wordMatch(p, q)))                         return 900;
  // Joined segment match (e.g. "wifi" matches "wi_fi")
  if (parts.some(p => p.split('_').join('') === q))             return 890;
  // Exact search term word match
  if (terms.some(t => wordMatch(t, q)))                         return 850;
  // Category exact word match
  if (cat.split(' ').includes(q) || cat === q)                  return 500;
  // Prefix match on name parts — queries 2+ chars
  if (q.length >= 2) {
    if (parts.some(p => p.split('_').some(w => w.startsWith(q)))) return 450;
    if (parts.some(p => p.split('_').join('').startsWith(q)))      return 445;
    if (terms.some(t => t.split('_').some(w => w.startsWith(q)))) return 430;
  }
  // Synonyms — queries 3+ chars only
  if (q.length >= 3) {
    const synonyms = SYNONYMS[q] || [];
    if (synonyms.some(s => parts.some(p => wordMatch(p, s)) || terms.some(t => wordMatch(t, s)))) return 400;
  }
  // Fuzzy — queries 7+ chars only, high threshold
  if (q.length >= 7) {
    const fuzzyParts = Math.max(...parts.map(p => Math.max(...p.split('_').map(w => fuzzyMatch(w, q)))), 0);
    const fuzzyTerms = Math.max(...terms.map(t => fuzzyMatch(t, q)), 0);
    const fuzzyBest  = Math.max(fuzzyParts, fuzzyTerms);
    if (fuzzyBest > q.length * 0.9)                            return 200 + fuzzyBest;
  }
  return 0;
}

function getFiltered() {
  const q = state.search.toLowerCase().trim().replace(/-/g, '');
  if (!q) {
    return iconsData.filter(i => state.category === 'All' || i.category === state.category);
  }
  const words = q.split(/\s+/).filter(w => w.length > 0);
  const scored = iconsData
    .map(i => {
      // Multi-word: score each word and take the minimum (all words must match)
      if (words.length > 1) {
        const wordScores = words.map(w => scoreIcon(i, w));
        const minScore = Math.min(...wordScores);
        return { icon: i, score: minScore > 0 ? minScore : 0 };
      }
      return { icon: i, score: scoreIcon(i, q) };
    })
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score);
  return scored.map(x => x.icon);
}

function getPath(icon, wIdx) {
  const w = WEIGHTS[wIdx !== undefined ? wIdx : state.weightIdx];
  const s = state.style;
  const fallback = s === 'fill' ? 'stroke' : 'fill';
  const v = icon.variants || {};
  if (v[w] && v[w][s]) return v[w][s];
  for (const ww of WEIGHTS) { if (v[ww] && v[ww][s]) return v[ww][s]; }
  if (v[w] && v[w][fallback]) return v[w][fallback];
  for (const ww of WEIGHTS) { if (v[ww] && v[ww][fallback]) return v[ww][fallback]; }
  return null;
}

function parseTags(icon) {
  const raw = icon.name || '';
  const segments = raw.split('-');
  segments.shift(); // remove first segment (icon name)
  const tags = segments.filter(t => t.length > 1 && !/^[a-z]$/.test(t)); // remove single-char suffixes
  return [...new Set(tags)].filter(t => t && t !== raw);
}

// Animated scroll to a category section. The browser's native smooth scroll is
// cancelled by the virtualised grid re-rendering mid-flight, so we drive it by hand.
// Target = section title landing exactly where "Popular" sits on first load.
function scrollToCategory(catKey) {
  const wrap = document.querySelector('.main-wrap');
  const target = catKey === 'All' ? null : document.getElementById(catSlug(catKey));
  const TOP_PAD = parseInt(getComputedStyle(document.querySelector('main')).paddingTop, 10) || 28;
  const measure = () => {
    if (!target) return 0;
    // anchor on the TITLE, not the section: sections carry 28px top padding, so
    // aligning the section box would land the heading a padding lower than "Popular"
    const anchor = target.querySelector('.category-title') || target;
    const wr = wrap.getBoundingClientRect().top;
    const tr = anchor.getBoundingClientRect().top;
    return Math.max(0, Math.round(wrap.scrollTop + (tr - wr - TOP_PAD)));
  };
  const from = wrap.scrollTop;
  const to = measure();
  if (Math.abs(to - from) < 2) return;
  const DUR = 720;
  // ease-out tuned so ~66% of the duration is spent on the final 10% of travel
  const ease = t => 1 - Math.pow(1 - t, 5.54);
  const t0 = performance.now();
  let done = false;
  const settle = () => {
    if (done) return;
    done = true;
    // grid height can shift as cards render in; correct once at the end
    const corrected = measure();
    if (Math.abs(corrected - wrap.scrollTop) > 2) wrap.scrollTop = corrected;
  };
  (function step(now) {
    if (done) return;
    const t = Math.min(1, (now - t0) / DUR);
    wrap.scrollTop = from + (to - from) * ease(t);
    if (t < 1) requestAnimationFrame(step); else settle();
  })(t0);
  // rAF is paused in hidden/background tabs — land on the anchor regardless
  setTimeout(() => { if (!done) { wrap.scrollTop = to; settle(); } }, DUR + 250);
}

function catSlug(n){ return 'cat-' + String(n).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

function render() {
  state.focusedIdx = -1;
  _fastUpdatePending = false;
  const icons = getFiltered();
  const countable = icons.length;
  const countEl = document.getElementById('searchCount');
  countEl.textContent = countable;
  countEl.classList.toggle('visible', countable > 0 && !!state.search);
  const main = document.getElementById('main');
  if (!icons.length) {
    const emptyPhrases = [["\u201c" + state.search + "\u201d? Never heard of it.", "Request Icon"],["Looked everywhere. No \u201c" + state.search + "\u201d.", "Request Icon"],["\u201c" + state.search + "\u201d is playing hide and seek.", "Request Icon"],["We have " + iconsData.filter(i => i.category !== 'Popular').length + " icons. \u201c" + state.search + "\u201d is not one of them.", "Request Icon"],["\u201c" + state.search + "\u201d doesn\u0027t exist here. Yet.", "Request Icon"]]; const _ep = emptyPhrases[Math.floor(Math.random() * emptyPhrases.length)]; main.innerHTML = `<div class="empty">${_ep[0]}<br><a href="#" onclick="requestIcon('${state.search.replace(/'/g, "\\'")}');return false;">${_ep[1]}</a></div>`;
    // Track failed search
    trackFailedSearch(state.search);
    return;
  }
  if (state.search) {
    const frag = document.createDocumentFragment();
    const sec = document.createElement('div'); sec.className = 'category-section';
    const grid = document.createElement('div'); grid.className = 'icons-grid';
    icons.forEach(icon => grid.appendChild(makeCard(icon)));
    sec.appendChild(grid); frag.appendChild(sec);
    main.innerHTML = ''; main.appendChild(frag);
  } else {
    const grouped = {};
    icons.forEach(i => { const c = i.category || 'Other'; (grouped[c] = grouped[c] || []).push(i); });
    // Popular: the curated set from meta.popular (in its order), falling back to the flag; the icons stay in their real categories too
    const byId = {}; icons.forEach(i => { byId[i.name.split('-')[0]] = i; });
    let pop = (meta.popular || []).map(id => byId[id]).filter(Boolean);
    if (!pop.length) pop = icons.filter(i => i.popular);
    if (pop.length) grouped['Popular'] = pop;
    // Pinned order first, rest alphabetical
    const PINNED = ['Popular', 'Interface', 'Files & Data', 'Hardware', 'Map'];
    const pinned = PINNED.filter(k => grouped[k]).map(k => [k, grouped[k]]);
    const ord = [...pinned, ...Object.keys(grouped).filter(k => !PINNED.includes(k)).sort((a,b) => a.localeCompare(b)).map(k => [k, grouped[k]])];
    const frag = document.createDocumentFragment();
    ord.forEach(([cat, catIcons]) => {
      const sec = document.createElement('div'); sec.className = 'category-section';
      sec.id = catSlug(cat);
      const title = document.createElement('div'); title.className = 'category-title';
      title.innerHTML = toTitleCase(cat) + '<span>' + catIcons.length + '</span>';
      sec.appendChild(title);
      const grid = document.createElement('div'); grid.className = 'icons-grid';
      catIcons.forEach(icon => grid.appendChild(makeCard(icon)));
      sec.appendChild(grid); frag.appendChild(sec);
    });
    main.innerHTML = ''; main.appendChild(frag);
  }
  if (panelIcon) {
    const active = main.querySelector('[data-name="' + panelIcon.name + '"]');
    if (active) active.classList.add('active-panel');
  }
}

// Fast path: only swap SVG paths on visible cards, no DOM rebuild
let _fastUpdatePending = false;
let iconsMap = {};
function fastUpdate() {
  _fastUpdatePending = true;
  const mainWrap = document.querySelector('.main-wrap');
  if (!mainWrap) return;
  const top = mainWrap.scrollTop - 300;
  const bottom = top + mainWrap.clientHeight + 600;
  document.querySelectorAll('.icon-card').forEach(card => {
    const cardTop = card.offsetTop;
    if (cardTop + 128 < top || cardTop > bottom) return;
    const icon = iconsMap[card.dataset.name];
    if (!icon) return;
    const path = getPath(icon);
    const p = card.querySelector('svg path');
    if (p && path) p.setAttribute('d', path);
    else if (!p && path) {
      const svgWrap = card.querySelector('.icon-svg-wrap');
      if (svgWrap) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('width', '48'); svg.setAttribute('height', '48');
        svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('fill', 'currentColor');
        const newP = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        newP.setAttribute('d', path); svg.appendChild(newP);
        svgWrap.innerHTML = ''; svgWrap.appendChild(svg);
      }
    }
  });
}

function makeCard(icon) {
  const path = getPath(icon);
  const card = document.createElement('div');
  card.className = 'icon-card' + (panelIcon && panelIcon.name === icon.name ? ' active-panel' : '');
  card.dataset.name = icon.name;

  const svgWrap = document.createElement('div'); svgWrap.className = 'icon-svg-wrap';
  if (path) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', '48'); svg.setAttribute('height', '48');
    svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('fill', 'currentColor');
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', path); svg.appendChild(p); svgWrap.appendChild(svg);
  }
  card.appendChild(svgWrap);

  const label = document.createElement('div'); label.className = 'icon-label';
  const labelText = formatSegment(icon.name.split('-')[0]);
  label.textContent = labelText;
  card.appendChild(label);

  card.addEventListener('click', e => {
    if (window.innerWidth <= 480) {
      // tap opens the bottom sheet; copying is one of its buttons
      openPanel(icon);
      return;
    }
    // Update focusedIdx so arrow keys start from here
    const allCards = Array.from(document.querySelectorAll('.icon-card'));
    state.focusedIdx = allCards.indexOf(card);
    allCards.forEach(c => c.classList.remove('focused'));
    card.classList.add('focused');

    if (panelIcon && panelIcon.name === icon.name) {
      copySVG(icon);
    } else {
      openPanel(icon);
    }
  });

  return card;
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('visible');
  clearTimeout(toastTimer);
  const duration = 2000;
  toastTimer = setTimeout(() => el.classList.remove('visible'), duration);
}

// ── PDF export ───────────────────────────────────────────────────────────────
// Icon paths use only M/H/V/L/C/Z, which map 1:1 onto PDF path operators —
// so this is a true vector export, no rasterising or curve approximation.
function svgPathToPdfOps(d, size) {
  const k = size / 24;
  const X = x => (x * k).toFixed(3);
  const Y = y => ((24 - y) * k).toFixed(3);   // PDF origin is bottom-left
  const out = [];
  let cx = 0, cy = 0, sx = 0, sy = 0;
  const re = /([MLHVCZmlhvcz])([^MLHVCZmlhvcz]*)/g;
  let m;
  while ((m = re.exec(d)) !== null) {
    const cmd = m[1];
    const n = (m[2].match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi) || []).map(Number);
    switch (cmd) {
      case 'M': for (let i = 0; i + 1 < n.length; i += 2) {
                  cx = n[i]; cy = n[i+1];
                  if (i === 0) { sx = cx; sy = cy; out.push(X(cx) + ' ' + Y(cy) + ' m'); }
                  else out.push(X(cx) + ' ' + Y(cy) + ' l');
                } break;
      case 'L': for (let i = 0; i + 1 < n.length; i += 2) { cx = n[i]; cy = n[i+1]; out.push(X(cx) + ' ' + Y(cy) + ' l'); } break;
      case 'H': for (const v of n) { cx = v; out.push(X(cx) + ' ' + Y(cy) + ' l'); } break;
      case 'V': for (const v of n) { cy = v; out.push(X(cx) + ' ' + Y(cy) + ' l'); } break;
      case 'C': for (let i = 0; i + 5 < n.length; i += 6) {
                  out.push(X(n[i]) + ' ' + Y(n[i+1]) + ' ' + X(n[i+2]) + ' ' + Y(n[i+3]) + ' ' + X(n[i+4]) + ' ' + Y(n[i+5]) + ' c');
                  cx = n[i+4]; cy = n[i+5];
                } break;
      case 'Z': case 'z': out.push('h'); cx = sx; cy = sy; break;
    }
  }
  return out.join('\n');
}

function buildIconPdf(pathData, size) {
  const content = '0 0 0 rg\n' + svgPathToPdfOps(pathData, size) + '\nf\n';
  const objs = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + size + ' ' + size + '] /Contents 4 0 R /Resources << >> >>',
    '<< /Length ' + content.length + ' >>\nstream\n' + content + 'endstream',
  ];
  let pdf = '%PDF-1.4\n';
  const offsets = [];
  objs.forEach(function (o, i) { offsets.push(pdf.length); pdf += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
  const xref = pdf.length;
  pdf += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
  offsets.forEach(function (o) { pdf += String(o).padStart(10, '0') + ' 00000 n \n'; });
  pdf += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';
  return pdf;
}

function downloadPDF(icon, size) {
  const sz = size || panelSize || 24;
  const path = getPath(icon);
  if (!path) return;
  const blob = new Blob([buildIconPdf(path, sz)], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = iconFileName(icon) + '.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  showToast(formatSegment(icon.name.split('-')[0]) + ' PDF Saved');
  trackDownload(icon, 'Save PDF', sz);
}

function downloadSVG(icon, color, sz) {
  color = color || '#141414'; sz = sz || panelSize || 24;
  const path = getPath(icon); if (!path) return;
  const svg = '<svg id="' + iconFileName(icon) + '" xmlns="http://www.w3.org/2000/svg" width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="' + color + '"><path id="' + formatSegment(icon.name.split('-')[0]) + '" d="' + path + '"/></svg>';
  const blob = new Blob([svg], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = iconFileName(icon) + '.svg';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 100);
  showToast('SVG for ' + formatSegment(icon.name.split('-')[0]) + ' Saved');
  trackDownload(icon, 'Save SVG', sz);
}

function downloadPNG(icon, color, sz) {
  color = color || '#141414'; sz = sz || panelSize || 24;
  const path = getPath(icon); if (!path) return;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="' + color + '"><path d="' + path + '"/></svg>';
  const img = new Image();
  const blob = new Blob([svg], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    const canvas = document.createElement('canvas'); canvas.width = sz; canvas.height = sz;
    canvas.getContext('2d').drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    const a = document.createElement('a'); a.href = canvas.toDataURL('image/png'); a.download = iconFileName(icon) + '.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    showToast('PNG for ' + formatSegment(icon.name.split('-')[0]) + ' Saved');
    trackDownload(icon, 'Save PNG', sz);
  };
  img.src = url;
}

function copySVG(icon, sz) {
  sz = sz || panelSize || 24;
  const path = getPath(icon); if (!path) return;
  const svg = '<svg id="' + iconFileName(icon) + '" xmlns="http://www.w3.org/2000/svg" width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="#141414"><path id="' + formatSegment(icon.name.split('-')[0]) + '" d="' + path + '"/></svg>';
  navigator.clipboard.writeText(svg).then(() => showToast('SVG for ' + formatSegment(icon.name.split('-')[0]) + ' Copied')).catch(() => showToast('Copy failed'));
  trackDownload(icon, 'Copy SVG', sz);
}

// One action for the three Copy-code buttons and their W / A / I shortcuts.
function copyCode(icon, label) {
  const gen = { Web: cssSnippet, Android: androidSnippet, Apple: iosSnippet }[label];
  if (!gen || !icon) return;
  navigator.clipboard.writeText(gen(icon))
    .then(() => showToast(label + ' code for ' + formatSegment(icon.name.split('-')[0]) + ' Copied'))
    .catch(() => showToast('Copy failed'));
  trackDownload(icon, 'Copy ' + label);
}

function cssSnippet(icon) {
  const name = (icon.name.split('-')[0]).replace(/_/g,'-').toLowerCase();
  const sz = panelSize || 24;
  const path = getPath(icon) || '';
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="' + path + '"/></svg>';
  const enc = encodeURIComponent(svg).replace(/'/g, '%27').replace(/"/g, '%22');
  return '.icon-' + name + ' {\n  display: inline-block;\n  width: ' + sz + 'px;\n  height: ' + sz + 'px;\n  background-color: currentColor;\n  -webkit-mask: url("data:image/svg+xml,' + enc + '") center / contain no-repeat;\n          mask: url("data:image/svg+xml,' + enc + '") center / contain no-repeat;\n}';
}

function androidSnippet(icon) {
  const name = (icon.name.split('-')[0]).replace(/ /g,'_').toLowerCase();
  const path = getPath(icon) || '';
  const sz = panelSize || 24;
  return '<!-- res/drawable/ic_' + name + '.xml -->\n<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="' + sz + 'dp" android:height="' + sz + 'dp"\n    android:viewportWidth="24" android:viewportHeight="24">\n  <path android:fillColor="#FF000000"\n        android:pathData="' + path + '"/>\n</vector>';
}

// SVG path -> SwiftUI Path. Every icon in the library uses only absolute
// M/H/V/L/C/Z, so the mapping is exact — no arc or quadratic cases to cover.
function swiftPathStatements(d) {
  const out = [];
  const num = v => { const r = Math.round(v * 1000) / 1000; return String(r); };
  const pt = (x, y) => 'CGPoint(x: ' + num(x) + ' * s, y: ' + num(y) + ' * s)';
  let cx = 0, cy = 0, sx = 0, sy = 0, m;
  const re = /([MHVLCZ])([^MHVLCZ]*)/gi;
  while ((m = re.exec(d)) !== null) {
    const cmd = m[1].toUpperCase();
    const a = (m[2].match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi) || []).map(Number);
    if (cmd === 'M') {
      for (let i = 0; i + 1 < a.length; i += 2) {
        cx = a[i]; cy = a[i + 1];
        if (i === 0) { sx = cx; sy = cy; out.push('p.move(to: ' + pt(cx, cy) + ')'); }
        else out.push('p.addLine(to: ' + pt(cx, cy) + ')');   // implicit lineto after moveto
      }
    } else if (cmd === 'L') {
      for (let i = 0; i + 1 < a.length; i += 2) { cx = a[i]; cy = a[i + 1]; out.push('p.addLine(to: ' + pt(cx, cy) + ')'); }
    } else if (cmd === 'H') {
      for (const x of a) { cx = x; out.push('p.addLine(to: ' + pt(cx, cy) + ')'); }
    } else if (cmd === 'V') {
      for (const y of a) { cy = y; out.push('p.addLine(to: ' + pt(cx, cy) + ')'); }
    } else if (cmd === 'C') {
      for (let i = 0; i + 5 < a.length; i += 6) {
        out.push('p.addCurve(to: ' + pt(a[i + 4], a[i + 5]) + ',\n                   control1: ' + pt(a[i], a[i + 1]) +
                 ',\n                   control2: ' + pt(a[i + 2], a[i + 3]) + ')');
        cx = a[i + 4]; cy = a[i + 5];
      }
    } else if (cmd === 'Z') {
      out.push('p.closeSubpath()'); cx = sx; cy = sy;
    }
  }
  return out;
}

function iosSnippet(icon) {
  const raw = icon.name.split('-')[0];
  let type = raw.split(/[_ ]+/).filter(Boolean)
                .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
  if (!/^[A-Za-z]/.test(type)) type = 'Icon' + type;   // Swift type names can't start with a digit
  type += 'Shape';
  const sz = panelSize || 24;
  const path = getPath(icon) || '';
  const body = swiftPathStatements(path).map(l => '        ' + l).join('\n');
  return 'struct ' + type + ': Shape {\n' +
         '    func path(in rect: CGRect) -> Path {\n' +
         '        let s = min(rect.width, rect.height) / 24\n' +
         '        var p = Path()\n' +
         body + '\n' +
         '        return p\n' +
         '    }\n' +
         '}\n\n' +
         type + '()\n' +
         '    .fill(.primary)\n' +
         '    .frame(width: ' + sz + ', height: ' + sz + ')';
}

function updatePanelPreview(icon) {
  const path = getPath(icon);
  const preview = document.getElementById('panelPreview');
  const existing = preview.querySelector('svg');
  if (existing) existing.remove();
  if (!path) return;
  const pair = preview._colorPair || ['#141414', '#ffffff'];
  const [bg, fg] = pair;

document.addEventListener('keydown', e => {
  const mk = (e.key || '').toLowerCase();   // Shift+S reports 'S' — compare case-insensitively
  if ((e.ctrlKey || e.metaKey) && mk === 'k') { e.preventDefault(); document.getElementById('search').focus(); }
  if (e.key === 'Escape') {
    document.getElementById('search').blur();  state.focusedIdx = -1;
    document.getElementById('panel').classList.remove('sheet-open');
    document.getElementById('burgerMenu').classList.remove('open');
  }
  // Shortcuts stand down inside ANY text field (search, mobile search, export-size input...)
  const ae = document.activeElement;
  const searchFocused = !!ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT' || ae.isContentEditable);
  const hasSelection = window.getSelection && window.getSelection().toString().length > 0;
  if ((e.ctrlKey || e.metaKey) && mk === 'c' && panelIcon && !searchFocused && !hasSelection) { e.preventDefault(); copySVG(panelIcon); }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && mk === 's' && panelIcon && !searchFocused) { e.preventDefault(); downloadSVG(panelIcon); }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && mk === 's' && panelIcon && !searchFocused) { e.preventDefault(); downloadPNG(panelIcon); }

  if (searchFocused) return;

  // Bare-key shortcuts (search is already excluded above)
  if (!e.ctrlKey && !e.metaKey && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === '/') { e.preventDefault(); document.getElementById('search').focus(); return; }
    if (k === 's') { e.preventDefault(); setStyleFromKey('stroke'); return; }
    if (k === 'f') { e.preventDefault(); setStyleFromKey('fill'); return; }
    if (k >= '1' && k <= '7') { e.preventDefault(); setWeightFromKey(parseInt(k, 10) - 1); return; }
    if (k === '[') { e.preventDefault(); setWeightFromKey(state.weightIdx - 1); return; }
    if (k === ']') { e.preventDefault(); setWeightFromKey(state.weightIdx + 1); return; }
    if (k === 'w' && panelIcon) { e.preventDefault(); copyCode(panelIcon, 'Web'); return; }
    if (k === 'a' && panelIcon) { e.preventDefault(); copyCode(panelIcon, 'Android'); return; }
    if (k === 'i' && panelIcon) { e.preventDefault(); copyCode(panelIcon, 'Apple'); return; }
  }
  const arrows = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
  if (!arrows.includes(e.key) && e.key !== 'Enter') return;

  const icons = getFiltered();
  if (!icons.length) return;

  const grid = document.querySelector('main');
  const cards = grid ? Array.from(grid.querySelectorAll('.icon-card')) : [];
  if (!cards.length) return;

  // Compute cols per section based on card positions within that section
  function getColsForCard(card) {
    const section = card.closest('.category-section');
    if (!section) return 1;
    const sectionCards = Array.from(section.querySelectorAll('.icon-card'));
    if (!sectionCards.length) return 1;
    const firstTop = sectionCards[0].getBoundingClientRect().top;
    return sectionCards.filter(c => Math.abs(c.getBoundingClientRect().top - firstTop) < 5).length || 1;
  }

  if (state.focusedIdx === undefined) state.focusedIdx = -1;

  // If no focused idx yet, start from the currently active panel icon
  let idx = state.focusedIdx;
  if (idx < 0 && panelIcon) {
    idx = cards.findIndex(c => c.dataset.name === panelIcon.name);
    if (idx < 0) idx = -1;
  }

  // Enter: copy/download active icon
  if (e.key === 'Enter') {
    const targetName = idx >= 0 && cards[idx] ? cards[idx].dataset.name : (panelIcon && panelIcon.name);
    const icon = targetName && iconsData.find(i => i.name === targetName);
    if (icon) {
      if (e.altKey) downloadPDF(icon);
      else if (e.shiftKey) downloadSVG(icon);
      else copySVG(icon);
    }
    return;
  }

  if (e.key === 'ArrowRight') {
    if (idx >= cards.length - 1) return;
    idx = idx < 0 ? 0 : idx + 1;
  } else if (e.key === 'ArrowLeft') {
    if (idx <= 0) return;
    idx = idx - 1;
  } else if (e.key === 'ArrowDown') {
    const curIdx = idx < 0 ? 0 : idx;
    const curCard = cards[curIdx];
    const curSection = curCard?.closest('.category-section');
    const sectionCards = curSection ? Array.from(curSection.querySelectorAll('.icon-card')) : [];
    const cols = getColsForCard(curCard);
    const idxInSection = sectionCards.indexOf(curCard);
    const nextInSection = idxInSection + cols;

    if (nextInSection >= sectionCards.length) {
      // Cross into the next category, keeping the same column where possible
      const cats = Array.from(document.querySelectorAll('.category-section'));
      const currentCatIdx = cats.indexOf(curSection);
      if (currentCatIdx >= cats.length - 1) return;
      const nextCatCards = Array.from(cats[currentCatIdx + 1].querySelectorAll('.icon-card'));
      if (!nextCatCards.length) return;
      const col = idxInSection % cols;
      idx = cards.indexOf(nextCatCards[Math.min(col, nextCatCards.length - 1)]);
      if (idx < 0) return;
    } else {
      idx = cards.indexOf(sectionCards[nextInSection]);
    }
  } else if (e.key === 'ArrowUp') {
    const curIdx = idx < 0 ? 0 : idx;
    const curCard = cards[curIdx];
    const curSection = curCard?.closest('.category-section');
    const sectionCards = curSection ? Array.from(curSection.querySelectorAll('.icon-card')) : [];
    const cols = getColsForCard(curCard);
    const idxInSection = sectionCards.indexOf(curCard);
    const prevInSection = idxInSection - cols;
    if (prevInSection < 0) {
      // First row: cross up into the previous category's last row, same column
      const cats = Array.from(document.querySelectorAll('.category-section'));
      const currentCatIdx = cats.indexOf(curSection);
      if (currentCatIdx <= 0) return;
      const prevCards = Array.from(cats[currentCatIdx - 1].querySelectorAll('.icon-card'));
      if (!prevCards.length) return;
      const prevCols = getColsForCard(prevCards[0]) || cols;
      const lastRowStart = Math.floor((prevCards.length - 1) / prevCols) * prevCols;
      const col = idxInSection % cols;
      // Stay in the same column: if the previous section's last row is short and
      // doesn't reach this column, step back a row rather than snapping to its
      // final icon (which jumps you across the grid).
      let target = lastRowStart + col;
      if (target >= prevCards.length) target = lastRowStart - prevCols + col;
      if (target < 0 || target >= prevCards.length) target = prevCards.length - 1;
      idx = cards.indexOf(prevCards[target]);
      if (idx < 0) return;
    } else {
      idx = cards.indexOf(sectionCards[prevInSection]);
      if (idx < 0) return;
    }
  }

  if (idx < 0) idx = 0;
  e.preventDefault();
  state.focusedIdx = idx;

  cards.forEach(c => c.classList.remove('focused'));
  if (cards[idx]) {
    cards[idx].classList.add('focused');
    cards[idx].scrollIntoView({ block: 'nearest' });
    const iconName = cards[idx].dataset.name;
    const icon = iconsData.find(i => i.name === iconName);
    if (icon) openPanel(icon);
  }
});

function sendAnalytics(payload) {

const _tracked = new Set();
let _trackTimer = null;
function trackFailedSearch(query) {

  _trackTimer = setTimeout(() => {
    const q = query.trim().toLowerCase();
    if (!q || q.length < 2 || _tracked.has(q)) return;

  document.getElementById('search').value = '';
  document.getElementById('clearBtnMob').classList.remove('visible');

});

// Tablet category dropdown
function buildTabCatDropdown() {
  const dropdown = document.getElementById('tabCatDropdown');
  if (!dropdown) return;
  dropdown.innerHTML = '';
  const map = {};
  iconsData.forEach(i => { const c = i.category || 'Other'; map[c] = (map[c] || 0) + 1; });
  const total = iconsData.length;   // no duplicate Popular entries any more
  const SIDEBAR_PINNED = ['Interface', 'Files & Data', 'Hardware', 'Map'];
  const pinnedEntries = SIDEBAR_PINNED.filter(k => map[k]).map(k => [k, map[k]]);
  const sorted = [...pinnedEntries, ...Object.entries(map).filter(([name]) => !SIDEBAR_PINNED.includes(name)).sort(([a],[b]) => a.localeCompare(b))];
  const popularCount = iconsData.filter(i => i.popular).length;
  [['Popular', popularCount], ...sorted].forEach(([name, count]) => {
    const catKey = name;
    const btn = document.createElement('button');
    btn.className = 'tab-cat-option' + (((state.activeCat || 'Popular') === catKey) ? ' active' : '');
    btn.innerHTML = '<span>' + toTitleCase(name) + '</span><span class="tab-cat-count">' + count + '</span>';
    btn.addEventListener('click', () => {
      // Match the desktop sidebar: categories navigate, they don't filter
      state.category = 'All';
      state.activeCat = catKey;
      state.search = '';
      document.getElementById('search').value = '';
      document.getElementById('searchMob') && (document.getElementById('searchMob').value = '');
      document.getElementById('tabCatLabel').textContent = toTitleCase(name);
      document.getElementById('tabCatDropdown').classList.remove('open');
      buildTabCatDropdown();
      buildSidebar();
      render();
      scrollToCategory(catKey);
    });
    dropdown.appendChild(btn);
  });
}

// Below 481px the panel is a sheet: opening an icon slides it in, and it can be closed.
(function initPanelSheet() {
  const panel = document.getElementById('panel');
  const isSmall = () => window.matchMedia('(max-width: 480px)').matches;
  const closeBtn = document.getElementById('panelSheetClose');
  if (closeBtn) closeBtn.addEventListener('click', () => panel.classList.remove('sheet-open'));
  document.addEventListener('click', e => {
    if (!isSmall()) return;
    const card = e.target.closest('.icon-card');
    if (!card) return;
    panel.classList.add('sheet-open');
    // the sheet covers the lower part of the screen — lift the tapped icon above it
    // bring the tapped icon's row to the top of the grid area, every time
    setTimeout(() => {
      const wrap = document.querySelector('.main-wrap');
      if (!wrap) return;
      const MARGIN = 12;
      const target = () => {
        const wrapTop = wrap.getBoundingClientRect().top;
        const cardTop = card.getBoundingClientRect().top;
        return Math.max(0, Math.min(wrap.scrollHeight - wrap.clientHeight,
                                    wrap.scrollTop + (cardTop - wrapTop - MARGIN)));
      };
      const from = wrap.scrollTop, to = target();
      if (Math.abs(to - from) < 2) return;
      const DUR = 380, t0 = performance.now();
      const ease = t => 1 - Math.pow(1 - t, 3);
      let done = false;
      const settle = () => { if (done) return; done = true; wrap.scrollTop = target(); };
      (function step(now) {
        if (done) return;
        const t = Math.min(1, (now - t0) / DUR);
        wrap.scrollTop = from + (to - from) * ease(t);
        if (t < 1) requestAnimationFrame(step); else settle();
      })(t0);
      setTimeout(() => { if (!done) { wrap.scrollTop = to; settle(); } }, DUR + 200);
    }, 60);
  }, true);
  window.addEventListener('resize', () => { if (!isSmall()) panel.classList.remove('sheet-open'); });
})();

// Slider stops: highlight only the dot nearest the pointer (the range input sits
// above them, so they can't be hovered directly).
(function initSliderStopHover() {
  document.querySelectorAll('.slider-track-wrap').forEach(function (wrap) {
    const stops = Array.from(wrap.querySelectorAll('.slider-stop'));
    if (!stops.length) return;
    wrap.addEventListener('mousemove', function (e) {
      const r = wrap.getBoundingClientRect();
      if (!r.width) return;
      const t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      const i = Math.round(t * (stops.length - 1));
      stops.forEach(function (d, n) { d.classList.toggle('hot', n === i); });
    });
    wrap.addEventListener('mouseleave', function () {
      stops.forEach(function (d) { d.classList.remove('hot'); });
    });
  });
})();

// Tablet (481-860): fold the right panel and the category dropdown into the left
// column, so there is one sidebar instead of two panels.
(function initTabletSingleColumn() {
  const panel = document.getElementById('panel');
  const aside = document.querySelector('aside');
  const controls = document.querySelector('aside .sidebar-controls');
  const catWrap = document.querySelector('.tab-cat-wrap');
  if (!panel || !aside || !controls) return;
  const panelHome = panel.parentNode, panelNext = panel.nextSibling;
  const catHome = catWrap ? catWrap.parentNode : null, catNext = catWrap ? catWrap.nextSibling : null;
  const themeBtn = document.getElementById('themeToggle');
  const themeHome = themeBtn ? themeBtn.parentNode : null;
  const burgerVer = document.querySelector('.burger-ver');
  const isTablet = () => window.matchMedia('(min-width: 481px) and (max-width: 860px)').matches;
  let folded = null;
  function apply() {
    const want = isTablet();
    if (want === folded) return;
    if (want) {
      if (catWrap) controls.appendChild(catWrap);
      const ver = aside.querySelector('.sidebar-ver');
      if (ver && ver.parentNode) ver.parentNode.insertBefore(panel, ver);
      else aside.appendChild(panel);
    } else {
      if (catWrap && catHome) catHome.insertBefore(catWrap, catNext);
      if (panelHome) panelHome.insertBefore(panel, panelNext);
    }
    folded = want;
  }
  apply();
  window.addEventListener('resize', apply);
})();

// Theme toggle lives in the burger menu at <=860 (mobile + tablet), in the sidebar above.
(function initThemeToggleHome() {
  const btn = document.getElementById('themeToggle');
  const burgerVer = document.querySelector('.burger-ver');
  if (!btn || !burgerVer) return;
  const home = btn.parentNode;
  const small = () => window.matchMedia('(max-width: 860px)').matches;
  let inMenu = null;
  function apply() {
    const want = small();
    if (want === inMenu) return;
    (want ? burgerVer : home).appendChild(btn);
    inMenu = want;
  }
  apply();
  window.addEventListener('resize', apply);
})();
